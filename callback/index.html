<body>
<h1>Connecting to ChannelOS…</h1>
<p>Returning the authorization to the ChannelOS app running on this computer.</p>
<p id="manual" hidden>If nothing happens, make sure ChannelOS is open and <a id="link" href="#">click here</a>.</p>
<script>
  // Retorno do login do TikTok: repassa o código para o ChannelOS local (o TikTok só aceita https no registro).
  var target = "http://127.0.0.1:5174/callback/" + location.search;
  document.getElementById("link").href = target;
  document.getElementById("manual").hidden = false;
  location.replace(target);
</script>
